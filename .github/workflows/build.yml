name: build

# Builds BOTH versions of ESPdevice in one workflow run:
#   - windows job -> artifacts "ESPdevice-win-installer" and "ESPdevice-win-portable"
#   - linux job   -> artifact  "ESPdevice-linux"
# Both run on every push to main, every pull request and from the Actions tab (Run workflow).
#
# Releases:
#   push a tag like v1.2.0       -> the Windows installer + portable zip are attached to that release
#   push a tag like 1.2.0_linux  -> the Linux tar.gz is attached to that release
# (both jobs still run for either tag, so you always get both artifacts to download from the run page)
on:
  push:
    branches: [main]
    tags: ['v*', '*_linux']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="1.2.0-dev-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          printf '#define ESP_VERSION "%s"\n' "$v" > app/version.h   # shown next to the credit on the page

      - name: Set up the MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build ESPdevice.exe
        shell: cmd
        working-directory: app
        run: |
          rc /nologo espdevice.rc
          cl /nologo /EHsc /std:c++17 /O2 /MT /DUNICODE /D_UNICODE ESPdevice.cpp espdevice.res /link /SUBSYSTEM:WINDOWS /OUT:ESPdevice.exe

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          $v = "${{ steps.ver.outputs.version }}"
          & $iscc "/DMyAppVersion=$v" installer/ESPdevice.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/installer, dist/portable | Out-Null
          $setup = Get-ChildItem -Recurse -Filter ESPdevice-Setup.exe -Path installer, . | Select-Object -First 1
          if (-not $setup) { throw "ESPdevice-Setup.exe was not produced; check the OutputDir/OutputBaseFilename in installer/ESPdevice.iss" }
          Copy-Item $setup.FullName dist/installer/
          Copy-Item app/ESPdevice.exe, LICENSE dist/portable/
          Compress-Archive -Path dist/installer/* -DestinationPath ESPdevice-win-installer.zip
          Compress-Archive -Path dist/portable/*  -DestinationPath ESPdevice-win-portable.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESPdevice-win-installer
          path: ESPdevice-win-installer.zip

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESPdevice-win-portable
          path: ESPdevice-win-portable.zip

  linux:
    runs-on: ubuntu-22.04   # older glibc, so the binary runs on most current distributions
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/*_linux ]]; then v="${GITHUB_REF_NAME#v}"; else v="1.2.0_linux-dev-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          printf '#define ESP_VERSION "%s"\n' "$v" > app/version.h   # shown next to the credit on the page

      - name: Build espdevice
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-unknown-pragmas -pthread -static-libstdc++ -static-libgcc app/ESPdevice.cpp -o espdevice
          strip espdevice
          ./espdevice --version

      - name: Self-test (simulated keypad, no hardware needed)
        run: python3 linux/selftest.py ./espdevice

      - name: Package
        run: |
          d=ESPdevice-linux-x86_64
          mkdir -p "$d"
          cp espdevice linux/install.sh linux/uninstall.sh linux/70-espdevice.rules linux/espdevice.desktop linux/espdevice.service linux/espdevice.png LICENSE "$d/"
          cp linux/README.md "$d/README.md"
          chmod +x "$d/espdevice" "$d/install.sh" "$d/uninstall.sh"
          tar czf ESPdevice-linux-x86_64.tar.gz "$d"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESPdevice-linux
          path: ESPdevice-linux-x86_64.tar.gz

  release:
    # Only for tags. Runs after both builds succeed, so a half-broken release can't be published.
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # needed to attach files to the release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach Windows files (tags like v1.2.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ESPdevice-win-installer.zip
            artifacts/ESPdevice-win-portable.zip
          generate_release_notes: true

      - name: Attach Linux file (tags like 1.2.0_linux)
        if: endsWith(github.ref, '_linux')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/ESPdevice-linux-x86_64.tar.gz
          generate_release_notes: true
